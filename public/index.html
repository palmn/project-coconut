<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMbet.se — Kommer snart!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #006AA7;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .flag-cross {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      color: #FECC02;
      text-shadow: 3px 3px 0 #004F7C;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: clamp(1.5rem, 5vw, 3rem);
      color: #fff;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .divider {
      width: 80px;
      height: 4px;
      background: #FECC02;
      margin: 0 auto 2rem;
      border-radius: 2px;
    }
    p {
      color: rgba(255,255,255,0.85);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="flag-cross">🇸🇪</div>
    <h1>VMbet</h1>
    <h2>Kommer snart!</h2>
    <div class="divider"></div>
    <p>Vi laddar upp inför stora matcher. Håll utkik!</p>
  </div>
</body>
</html>
